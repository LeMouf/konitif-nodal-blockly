name: Publish @konitif/nodal-blockly
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: package-npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'LeMouf/konitif-nodal-blockly' && vars.NODAL_BLOCKLY_NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require tag on main history
        run: git merge-base --is-ancestor HEAD origin/main
      - run: bash scripts/select-ci-runtime.sh
      - run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - run: npm run build
      - run: npm test
      - run: node scripts/check-release.mjs
      - name: Verify exact archive to publish
        run: node scripts/prepare-release-archive.mjs
      - name: Publish verified archive through npm OIDC
        run: npm publish .release/package.tgz --access public --provenance --ignore-scripts --registry=https://registry.npmjs.org
